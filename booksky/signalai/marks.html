
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Management</title>

    <link rel="stylesheet" href="markstyle.css">
    <script src="marks.js" defer></script>
</head>
<body>

    <div class="container">

        <h1>Student Grade Management System</h1>

        <form id="studentForm">

            <label for="studentName">Student Name</label>
            <input type="text" id="studentName"
                   placeholder="Enter student name" required>

            <h3>Enter Subject Marks</h3>

            <label for="subject1">Subject 1</label>
            <input type="number" id="subject1"
                   placeholder="Enter marks" required>

            <label for="subject2">Subject 2</label>
            <input type="number" id="subject2"
                   placeholder="Enter marks" required>

            <label for="subject3">Subject 3</label>
            <input type="number" id="subject3"
                   placeholder="Enter marks" required>

            <label for="subject4">Subject 4</label>
            <input type="number" id="subject4"
                   placeholder="Enter marks" required>

            <label for="subject5">Subject 5</label>
            <input type="number" id="subject5"
                   placeholder="Enter marks" required>

            <button type="submit">Calculate Result</button>

        </form>

        <div id="errorMessage"></div>

        <div id="result"></div>

    </div>

</body>
</html>
