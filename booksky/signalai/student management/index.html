
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration System</title>

    <link rel="stylesheet" href="style.css">
    

</head>

<body>

    <!-- Header -->
    <header>
        <h1>Student Registration System</h1>
        <p>Manage your student records</p>
    </header>

    <main>

        <!-- Dashboard -->
        <section class="dashboard">

            <div class="dashboard-card">
                <h2 id="total-students">0</h2>
                <p>Total Students</p>
            </div>

        </section>


        <!-- Student Registration Form -->
        <section class="form-section">

            <h2>Add New Student</h2>

            <form id="student-form" novalidate>

                <!-- Student Name -->
                <div class="form-group">

                    <label for="student-name">Student Name</label>

                    <input
                        type="text"
                        id="student-name"
                        placeholder="Enter student name"
                        maxlength="20"
                    >

                    <small id="name-count">20 characters remaining</small>

                </div>


                <!-- Student Email -->
                <div class="form-group">

                    <label for="student-email">Email Address</label>

                    <input
                        type="text"
                        id="student-email"
                        placeholder="Enter email address"
                        maxlength="40"
                    >

                    <small id="email-count">40 characters remaining</small>

                </div>


                <!-- Student Course -->
                <div class="form-group">

                    <label for="student-course">Select Course</label>

                    <select id="student-course">

                        <option value="">Choose a course</option>
                        <option value="HTML/CSS">HTML/CSS</option>
                        <option value="JavaScript">JavaScript</option>
                        <option value="Python">Python</option>
                        <option value="Java">Java</option>

                    </select>

                </div>


                <!-- Form Buttons -->
                <div class="form-buttons">

                    <button type="submit" id="add-student-btn">
                        Add Student
                    </button>

                    <button type="button" id="save-draft-btn">
                        Save as Draft
                    </button>

                </div>

            </form>

            <p id="message"></p>

        </section>


        <!-- Registered Students -->
        <section class="student-list-section">

            <div class="section-heading">

                <h2>Registered Students</h2>

                <button type="button" id="view-drafts-btn">
                    View Drafts
                </button>

            </div>


            <input
                type="text"
                id="search-student"
                placeholder="Search student by name..."
            >


            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="student-list"></tbody>

                </table>

            </div>

        </section>


        <!-- Draft Students -->
        <section class="student-list-section draft-section" id="draft-section" hidden>

            <h2>Draft Students</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="draft-list"></tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>Student Registration System</p>
    </footer>
<script src="script.js"></script>

</body>

</html>
