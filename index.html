
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignalAI - Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-page">

        <!-- LEFT: Sign-in form -->
        <section class="login-panel">

            <header class="brand">
                <svg class="brand-icon" viewBox="0 0 32 26" fill="none">
                    <path d="M3 8C10 -1 22 -1 29 8"
                          stroke="#2448F5" stroke-width="3.2"
                          stroke-linecap="round"/>
                    <path d="M7 13C12 7 20 7 25 13"
                          stroke="#2448F5" stroke-width="3.2"
                          stroke-linecap="round"/>
                    <path d="M12 18L16 22L20 18"
                          stroke="#2448F5" stroke-width="3.2"
                          stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>
                <span>SignalAI</span>
            </header>

            <div class="login-content">
                <p class="eyebrow">ACCOUNT</p>

                <h1>Sign in to your account</h1>

                <p class="description">
                    Enter your credentials to view all insights
                </p>

                <form class="login-form">

                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email address"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                        >
                    </div>

                    <button class="submit-button" type="button">
                        Submit <span class="arrow">→</span>
                    </button>

                    <button class="google-button" type="button">
                        <span class="google-icon">G</span>
                        <span>Sign in with Google</span>
                    </button>

                </form>
            </div>

        </section>

        <!-- RIGHT: Analytics illustration -->
        <section class="art-panel">

            <div class="dashboard">

                <div class="revenue-card">
                    <p class="card-heading">Total revenue</p>

                    <div class="revenue-row">
                        <strong>$354,320</strong>
                        <span class="growth">↑ 2.5%</span>
                    </div>

                    <div class="chart-layout">

                        <div class="pie-chart"></div>

                        <div class="chart-legend">
                            <div><i class="dot may"></i>May</div>
                            <div><i class="dot june"></i>June</div>
                            <div><i class="dot july"></i>July</div>
                            <div><i class="dot august"></i>August</div>
                        </div>

                    </div>
                </div>

                <div class="notifications">

                    <div class="notification">
                        <div class="avatar avatar-one">A</div>
                        <div class="notification-text">
                            <strong>Anna Peterson</strong>
                            <p><span class="message-icon">▰</span>
                                Sent a message to UXTank Inc.
                            </p>
                        </div>
                    </div>

                    <div class="notification">
                        <div class="avatar avatar-two">C</div>
                        <div class="notification-text">
                            <strong>Chris Meadow</strong>
                            <p><span class="check-icon">✓</span>
                                Accepted a new project Cascada
                            </p>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Layered abstract geometry -->
            <div class="geometry">

                <div class="shape shape-blue"></div>
                <div class="shape shape-glass"></div>
                <div class="shape shape-lavender"></div>
                <div class="shape shape-white"></div>
                <div class="shape shape-dark"></div>
                <div class="shape shape-front"></div>

            </div>

        </section>

    </main>

</body>
</html>
