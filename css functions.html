<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
  background-color: pink;
}

@media screen and (min-width: 380px) and (max-width: 368px) {
  body {
    background-color: lightgreen;
  }
}
        @font-face {
   font-family: myFont;
   src: url(sansation_light.woff);
}

@font-face {
   font-family: myFont;
   src: url(sansation_bold.woff);
   font-weight: bold;
}

* {
   font-family: myFont;
}
div {
  width: 150px;
  height: 150px;
  background-color: yellow;
  border: 1px solid black;
}

#myDiv {
  transform: rotate(20deg);
}
.tooltiptext {
  visibility: hidden;
  white-space: nowrap;
  
  background-color: black;
  color: #ffffff;
  text-align: center;
  border-radius: 6px;
  padding: 5px 0;
  position: relative;
  z-index: 1;
  top: -5px;
  left: 105%;
}

.tooltip:hover .tooltiptext {
  visibility: visible;
}
.container {
  position: relative;
  width: 50%;
}

.image {
  display: block;
  width: 100%;
  height: auto;
}

.overlay {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
  height: 100%;
  width: 100%;
  opacity: 0;
  transition: .5s ease;
  background-color: #008CBA;
}

.container:hover .overlay {
  opacity: 1;
}
.text {
  color: white;
  font-size: 20px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  -ms-transform: translate(-50%, -50%);
}
.pagination {
  display: flex;
  justify-content: center;
  list-style: none; /* remove list bullets */
  padding: 0px;
}

.pagination li a {
  display: block; /* let links fill the list item */
  padding: 8px 12px;
  text-decoration: none;
  border: 1px solid gray;
  color: black;  
  margin: 0 4px;
  border-radius: 5px; /* add rounded borders */
}
    </style>
</head>
<body>
   
 
   <h1>The @font-face Rule</h1>

<p>Websites can use other fonts than the pre-selected <strong>"web-safe"</strong> fonts.</p>
<div>
This a normal div element.
</div>

<div id="myDiv">
This div element is rotated clockwise 20 degrees.
</div><br><br>
<div class="tooltip">Hover over me
  <span class="tooltiptext">Some tooltip text</span>
</div><br>
<div class="container">
  <img src="img_avatar.png" alt="Avatar" class="image">
  <div class="overlay">
    <div class="text">Hello World</div>
  </div>
</div><br>
<ul class="pagination">
  <li><a href="#">&laquo;</a></li>
  <li><a href="#">1</a></li>
  <li><a href="#">2</a></li>
  <li><a href="#">3</a></li>
  <li><a href="#">4</a></li>
  <li><a href="#">5</a></li>
  <li><a href="#">&raquo;</a></li>
</ul>

 
</body>
</html>
